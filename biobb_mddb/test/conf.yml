global_properties:
  working_dir_path: /tmp/biobb/unitests

rmsd_per_residue:
  paths:
    input_topology_filepath: file:test_data_dir/workflow/topology.top
    input_trajectory_filepath: file:test_data_dir/workflow/trajectory.dcd
    ref_output_analysis_filepath: file:test_data_dir/workflow/mda.rmsd_perres.json
    output_analysis_filepath: mda.rmsd_perres.json
  properties:
    skip_processing: false
    remove_tmp: true

rmsd_per_residue_docker:
  paths:
    input_topology_filepath: file:test_data_dir/workflow/topology.top
    input_trajectory_filepath: file:test_data_dir/workflow/trajectory.dcd
    ref_output_analysis_filepath: file:test_data_dir/workflow/mda.rmsd_perres.json
    output_analysis_filepath: mda.rmsd_perres.json
  properties:
    skip_processing: false
    remove_tmp: true
    container_path: docker
    container_image: ghcr.io/mmb-irb/mddb_wf:latest
    container_volume_path: /tmp






